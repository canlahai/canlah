<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Programme invite — CanLah.ai</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{--ink:#ffffff;--paper:#1c2024;--yellow:#e0a400;--yellow-dk:#c98f00;--orange:#c2410c;--bg:#f7f7f8;--surface:#ffffff;--g8:#e8eaee;--g7:#dce1e7;--g4:#5f6b76;--green:#15803d;--red:#dc2626;--shadow:0 18px 50px rgba(16,24,40,.10),0 2px 8px rgba(16,24,40,.05)}
  *{box-sizing:border-box;margin:0}
  body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--paper);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:2rem;text-align:center;-webkit-font-smoothing:antialiased}
  .card{max-width:480px;width:100%;background:var(--surface);border:1px solid var(--g8);border-radius:16px;padding:2.5rem 2rem;box-shadow:var(--shadow)}
  .eyebrow{font-family:'Inter',sans-serif;font-size:11px;color:var(--orange);letter-spacing:.14em;text-transform:uppercase;margin-bottom:14px}
  h1{font-size:26px;font-weight:800;letter-spacing:-.02em;margin-bottom:10px}
  p{color:var(--g4);font-size:15px;line-height:1.6;margin-bottom:1rem}
  .tag{display:inline-block;font-family:'Inter',sans-serif;font-size:11px;text-transform:uppercase;letter-spacing:.08em;padding:4px 10px;border-radius:999px;border:1px solid var(--g7);color:var(--paper);margin:2px}
  .btn{display:inline-block;background:var(--yellow);color:#1c2024;font-weight:700;border:none;text-decoration:none;padding:11px 20px;border-radius:8px;margin:6px;cursor:pointer;font-family:'Inter'}
  .ghost{display:inline-block;color:var(--paper);text-decoration:none;border:1px solid var(--g7);padding:11px 20px;border-radius:8px;margin:6px}
  a.link{color:var(--yellow)}
  .err{color:#c2410c}
  .hidden{display:none}
</style>
</head>
<body>
  <div class="card">
    <div class="eyebrow">Programme invite</div>
    <div id="content"><p>Loading invite…</p></div>
  </div>
<script>
const $ = (id) => document.getElementById(id);
const token = new URLSearchParams(location.search).get('t') || new URLSearchParams(location.search).get('token');
const ACCESS_LABEL = { admin:'Admin', editor:'Editor', viewer:'Viewer (read-only)' };

function render(html){ $('content').innerHTML = html; }

const fld = "width:100%;margin:4px 0 10px;padding:9px 11px;border:1px solid var(--g7);border-radius:8px;background:var(--ink);color:var(--paper);font-family:'Inter',sans-serif";
const lbl = "font-size:11px;color:var(--g4);text-transform:uppercase;letter-spacing:.08em";
const nextUrl = () => encodeURIComponent(location.pathname + location.search);

async function main(){
  if (!token){ render('<h1>Invalid invite</h1><p>This link is missing its invite code.</p><a class="link" href="/">← Home</a>'); return; }

  let cfg = {};
  try { cfg = await (await fetch('/api/config')).json(); } catch {}
  const signedIn = !!(cfg.session && cfg.session.id) || cfg.demoMode;
  const usersMode = cfg.authMode === 'users';

  // Public invite info — works whether or not you're signed in (token is the secret).
  let invite = null, err = null;
  try {
    const r = await fetch('/api/invites?public=1&token=' + encodeURIComponent(token));
    if (r.ok) invite = (await r.json()).invite; else err = (await r.json().catch(()=>({}))).error || r.statusText;
  } catch(e){ err = e.message; }

  if (!invite){
    render(`<h1>Invite unavailable</h1><p class="err">${err || 'This invite was not found, or it has been used or revoked.'}</p><a class="link" href="/">← Home</a>`);
    return;
  }
  if (invite.status !== 'pending'){
    render(`<h1>Already ${invite.status}</h1><p>This invite has already been ${invite.status}.</p><a class="btn" href="/programme">Open Programme Planner →</a>`);
    return;
  }

  const trade = invite.tradeRole ? ` · <span class="tag">${invite.tradeRole}</span>` : '';
  const head = `<h1>${invite.programmeName || 'A programme'}</h1>
    <p>You're invited to join as:</p>
    <p><span class="tag">${ACCESS_LABEL[invite.accessLevel] || invite.accessLevel}</span>${trade}</p>
    <p style="font-size:13px">Invite for <strong style="color:var(--paper)">${invite.email}</strong></p>`;

  // Already signed in → one-click accept (server verifies the email matches).
  if (signedIn){
    render(head + `<button class="btn" id="accept">Accept &amp; join</button>
      <a class="ghost" href="/programme">Not now</a>
      <p id="msg" class="err" style="margin-top:1rem"></p>`);
    $('accept').onclick = async () => {
      $('accept').disabled = true; $('msg').textContent = '';
      try {
        const res = await fetch('/api/invites', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ action:'accept', token }) });
        const data = await res.json().catch(()=>({}));
        if (!res.ok){ $('msg').textContent = data.error || 'Could not accept the invite.'; $('accept').disabled = false; return; }
        render(`<h1>You're in 🎉</h1><p>You've joined <strong style="color:var(--paper)">${invite.programmeName||'the programme'}</strong> as ${ACCESS_LABEL[invite.accessLevel]||invite.accessLevel}.</p><a class="btn" href="/programme">Open Programme Planner →</a>`);
      } catch(e){ $('msg').textContent = e.message; $('accept').disabled = false; }
    };
    return;
  }

  // Signed out, per-user mode → let them create their own account right here.
  if (usersMode){
    render(head + `
      <p style="margin-top:1rem">Create your account to join — takes a few seconds.</p>
      <div style="text-align:left;max-width:320px;margin:0 auto">
        <label style="${lbl}">Your name (optional)</label>
        <input id="r-name" placeholder="e.g. Ah Seng" style="${fld}">
        <label style="${lbl}">Choose a password</label>
        <input id="r-pw" type="password" placeholder="at least 8 characters" style="${fld}">
      </div>
      <button class="btn" id="register">Create account &amp; join</button>
      <p style="font-size:13px;margin-top:10px">Already have an account? <a class="link" href="/login?next=${nextUrl()}">Sign in to accept</a></p>
      <p id="msg" class="err" style="margin-top:1rem"></p>`);
    $('register').onclick = async () => {
      const password = $('r-pw').value, name = $('r-name').value;
      if (!password || password.length < 8){ $('msg').textContent = 'Password must be at least 8 characters'; return; }
      $('register').disabled = true; $('msg').textContent = '';
      try {
        const res = await fetch('/api/invites', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ action:'registerAccept', token, name, password }) });
        const data = await res.json().catch(()=>({}));
        if (!res.ok){
          $('msg').innerHTML = (data.error || 'Could not create your account.') + (data.code==='exists' ? ` <a class="link" href="/login?next=${nextUrl()}">Sign in →</a>` : '');
          $('register').disabled = false; return;
        }
        render(`<h1>You're in 🎉</h1><p>Welcome${name?(', '+name.trim()):''}! You've joined <strong style="color:var(--paper)">${invite.programmeName||'the programme'}</strong> as ${ACCESS_LABEL[invite.accessLevel]||invite.accessLevel}.</p><a class="btn" href="/programme">Open Programme Planner →</a>`);
      } catch(e){ $('msg').textContent = e.message; $('register').disabled = false; }
    };
    return;
  }

  // Signed out, shared/demo mode → just sign in.
  render(head + `<p style="margin-top:1rem">Sign in to accept this invite.</p>
    <a class="btn" href="/login?next=${nextUrl()}">Sign in to continue</a>`);
}
main();
</script>
</body>
</html>
