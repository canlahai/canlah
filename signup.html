<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign up — CanLah.ai</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{--ink:#ffffff;--paper:#1c2024;--yellow:#e0a400;--orange:#c2410c;--bg:#f7f7f8;--surface:#ffffff;--g8:#e8eaee;--g7:#dce1e7;--g4:#5f6b76;--shadow:0 18px 50px rgba(16,24,40,.10),0 2px 8px rgba(16,24,40,.05)}
  *{box-sizing:border-box;margin:0}
  body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--paper);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:2rem;text-align:center;-webkit-font-smoothing:antialiased}
  .card{max-width:460px;background:var(--surface);border:1px solid var(--g8);border-radius:16px;padding:2.5rem 2rem;box-shadow:var(--shadow)}
  .eyebrow{font-family:'Inter',sans-serif;font-size:11px;color:var(--orange);letter-spacing:.14em;text-transform:uppercase;margin-bottom:14px}
  h1{font-size:28px;font-weight:800;letter-spacing:-.02em;margin-bottom:10px}
  p{color:var(--g4);font-size:15px;line-height:1.6;margin-bottom:1rem}
  a.btn{display:inline-block;background:var(--yellow);color:#1c2024;font-weight:700;text-decoration:none;padding:11px 20px;border-radius:8px;margin:6px}
  a.ghost{display:inline-block;color:var(--paper);text-decoration:none;border:1px solid var(--g7);padding:11px 20px;border-radius:8px;margin:6px}
  a.link{color:var(--yellow)}
</style>
</head>
<body>
  <div class="card">
    <div class="eyebrow">Early access</div>
    <h1>Accounts are invite-only</h1>
    <p>CanLah is in a pilot. Accounts are set up by our team for now — there's no open sign-up yet.
       Want in? Email <a class="link" href="mailto:hello@canlah.ai?subject=CanLah%20access">hello@canlah.ai</a> and we'll get you onboarded.</p>
    <a class="btn" href="mailto:hello@canlah.ai?subject=CanLah%20access">Request access</a>
    <a class="ghost" href="/login">I have an account → Sign in</a>
    <p style="margin-top:1.5rem;margin-bottom:0"><a class="link" href="/">← Back home</a></p>
  </div>
</body>
</html>
